name: Security pipeline

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1) Escaneo de dependencias (npm audit)
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
        continue-on-error: true

      # 2) SAST con Semgrep
      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/ci'   # reglas genéricas seguras para CI
        continue-on-error: true

      # 3) Build de imagen Docker para escanear
      - name: Build Docker image
        run: docker build -t vuln-app:ci .

      # 4) Escaneo de imagen/Dockerfile con Trivy
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'vuln-app:ci'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
        continue-on-error: true

      # 5) Búsqueda de secretos con Gitleaks
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source=. --no-banner --redact --report-format json --report-path gitleaks-report.json
        continue-on-error: true

      # 6) Subir los reportes como artefactos
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-report.json
            gitleaks-report.json
          if-no-files-found: ignore
